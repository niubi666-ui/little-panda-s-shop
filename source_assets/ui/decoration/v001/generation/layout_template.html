<style>
@font-face{font-family:ShopSerif;src:url('../../../../../game/assets/fonts/NotoSerifSC-VF.ttf')}
*{box-sizing:border-box}body{margin:0;background:#07120f;color:#f2e3b9;font-family:ShopSerif,serif}#bar{height:48px;display:flex;align-items:center;gap:20px;padding:0 24px;font:14px "Microsoft YaHei",sans-serif;border-bottom:1px solid #706143;color:#c9c6b0}a{color:#e9d59c}#bar button{background:#1c3427;color:#eddeb9;border:1px solid #958454;padding:5px 15px;cursor:pointer}#viewport{position:relative;overflow:hidden;margin:0 auto}#stage{width:1600px;height:1000px;transform-origin:top left;position:relative;overflow:hidden;background:#172924}.room{position:absolute;left:290px;top:0;width:1415px;height:1000px;object-fit:cover;opacity:.92}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#081b17 0%,transparent 45%),linear-gradient(0deg,#071a1599,transparent 28%)}.rim{position:absolute;inset:17px;border:1px solid #9b8d52;border-radius:20px;pointer-events:none}.leaf{position:absolute;width:210px;height:210px;pointer-events:none}.leaf.top{left:5px;top:3px}.leaf.bottom{right:4px;bottom:0;transform:rotate(180deg)}.title{position:absolute;left:69px;top:30px;font-size:42px;letter-spacing:4px;text-shadow:0 3px 5px #000}.title small{display:block;font:11px sans-serif;letter-spacing:5px;color:#b8b699;margin-top:4px}.mode{position:absolute;left:712px;top:27px;width:350px;height:54px;display:grid;place-items:center;font-size:23px}.piece{position:absolute;inset:0;overflow:hidden;pointer-events:none}.piece img{position:absolute;max-width:none}.mode span,.action span{z-index:1}.topright{position:absolute;right:42px;top:36px;display:flex;gap:22px;align-items:center;font:14px sans-serif;color:#bec5ab}.topright img{width:27px;height:27px}.sidebar{position:absolute;left:24px;top:119px;width:388px;height:816px;padding:23px 18px}.tabs{display:flex;gap:7px;position:relative;height:51px}.tab{border:0;color:#e7dcb7;background:transparent;flex:1;position:relative;font:19px ShopSerif;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}.tab img.symbol{width:24px;height:24px}.tab.off{opacity:.42;cursor:default}.tab.active{filter:brightness(1.16)}.items{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.tile{position:relative;width:170px;height:156px;color:#ede5c7;border:0;background:none;cursor:pointer;padding:12px 12px 30px}.tile:hover{filter:brightness(1.15)}.tile>.thumb{position:relative;width:100%;height:100%;object-fit:contain;z-index:1}.tile>.name{position:absolute;bottom:13px;left:10px;right:10px;font:18px ShopSerif;text-align:center;z-index:2}.tile>.selection{inset:-3px;z-index:2}.tile .future{position:absolute;left:10px;top:8px;font:10px sans-serif;color:#cfc8ad;z-index:3}.info{position:relative;margin-top:17px;padding:18px 13px 18px;min-height:170px;border-top:1px solid #93825188;display:flex;gap:13px;align-items:center}.info img{width:135px;height:143px;object-fit:contain}.info h2{font-size:24px;margin:0 0 9px}.info p{font-size:15px;color:#b2b99d;line-height:1.8;margin:0}.smallnote{position:relative;margin:8px 11px 0;padding-top:13px;border-top:1px solid #7c784655;color:#a4b095;font:13px/1.8 "Microsoft YaHei",sans-serif}.actions{position:absolute;left:630px;right:200px;bottom:65px;display:flex;gap:24px;justify-content:center}.action{position:relative;width:288px;height:63px;display:flex;align-items:center;justify-content:center;gap:12px;font:23px ShopSerif;border:0;background:transparent;color:#f2e3b9;cursor:pointer}.action img.symbol{position:relative;width:29px;height:29px;z-index:1}.action:hover{filter:brightness(1.16)}.hint{position:absolute;left:735px;top:520px;min-width:210px;background:#12261dde;border:1px solid #b5a76d99;border-radius:8px;padding:10px 17px;display:flex;gap:12px;align-items:center;font-size:19px;box-shadow:0 4px 15px #0005}.hint img{width:28px;height:35px}.caption{position:absolute;left:480px;bottom:25px;color:#c2c2a9;font:13px sans-serif;letter-spacing:1px}.countnote{position:absolute;right:39px;bottom:32px;color:#9da98d;font:12px sans-serif}.status{position:absolute;right:45px;top:94px;color:#d6d8ba;font:14px sans-serif;background:#10271fcc;padding:10px 16px;border:1px solid #667f58;border-radius:6px}
</style>
<div id="bar"><a href="index.html">← 素材总览</a><b>美术拼装示意 · 非 Godot 实机</b><button id="catalogToggle">查看参考扩展目录</button><span id="explanation">当前四种家具 · 点击卡片仅切换展示</span></div>
<div id="viewport"><div id="stage">
  <img class="room" src="../../../../environments/shop/previews/shop_interior_v006.png"><div class="shade"></div><div class="rim"></div>
  <img class="leaf top" src="../exports/chrome/leaf_corner.png"><img class="leaf bottom" src="../exports/chrome/leaf_corner.png">
  <div class="title">店铺装修<small>MAKE A PLACE YOUR OWN</small></div>
  <div class="mode" data-chrome="mode_banner"><span>装修模式</span></div>
  <div class="topright">布置你的小店<img src="../exports/icons/close.svg"></div>
  <div class="sidebar" data-chrome="catalog_panel">
    <div class="tabs"><button class="tab active" data-chrome="tab_button"><img class="symbol" src="../exports/icons/chair.svg">家具</button><button class="tab off" data-chrome="tab_button"><img class="symbol" src="../../../../../game/assets/ui/foliage/leaf.svg">装饰</button><button class="tab off" data-chrome="tab_button"><img class="symbol" src="../../../../../game/assets/ui/foliage/lamp.svg">灯具</button></div>
    <div id="items" class="items"></div>
    <div class="info"><img id="detailImage"><div><h2 id="detailName"></h2><p id="detailText"></p></div></div>
    <div id="smallnote" class="smallnote">先选择家具，再在地面确认位置。<br>当前为临时摆放原型，布局尚不保存。</div>
  </div>
  <div class="hint"><img src="../exports/icons/mouse_left.svg"><span>选择家具 · 预览摆放</span></div>
  <div class="actions"><button class="action" data-chrome="button_secondary"><img class="symbol" src="../exports/icons/rotate.svg"><span>旋转家具</span></button><button class="action" data-chrome="button_primary"><img class="symbol" src="../exports/icons/confirm.svg"><span>完成装修</span></button></div>
  <div class="caption">独立底图 + 家具缩略图 + 动态文字 + 选中状态</div><div class="countnote">ART PACK v001</div>
</div></div>
<script>
const assets=__ASSETS__;
const byName=Object.fromEntries(assets.map(a=>[a.id.split('.').at(-1),a]));
function piece(name,cls='') { const a=byName[name];if(!a)return document.createElement('i');const [x,y,w,h]=a.atlas_region_xywh;const [iw,ih]=a.size_px;const d=document.createElement('div');d.className='piece '+cls;const im=document.createElement('img');im.src='../exports/'+a.runtime_path.split('/v001/')[1];Object.assign(im.style,{width:(iw/w*100)+'%',height:(ih/h*100)+'%',left:(-x/w*100)+'%',top:(-y/h*100)+'%'});d.append(im);return d; }
document.querySelectorAll('[data-chrome]').forEach(e=>e.prepend(piece(e.dataset.chrome)));
const current=[['barrel','小木桶','暖木与金属箍组成的小木桶。'],['scroll_bin','卷轴桶','收纳店内常用卷轴的木桶。'],['supply_crate','药罐货箱','装有陶罐与店铺补给的木箱。'],['storage_chest','宝箱','厚实木板与古铜配件组成的宝箱。']];
const extended=[['chair_oak','木质椅子','备用美术；尚未接入摆放目录。'],['storage_chest','宝箱','当前目录已有对应家具。'],['potted_fern','盆栽蕨叶','备用美术；尚未接入摆放目录。'],['rug_crimson','酒红地毯','备用美术；尚未接入摆放目录。'],['bookshelf_potions','魔药书架','备用美术；尚未接入摆放目录。'],['wall_lantern','壁挂灯笼','备用美术；墙面摆放尚未实现。']];
let expanded=false;let selected='storage_chest';
function select(id){selected=id;render();}
function render(){const list=expanded?extended:current;const container=document.querySelector('#items');container.replaceChildren();for(const [id,name,description] of list){const b=document.createElement('button');b.className='tile';b.ariaLabel=name;b.prepend(piece('item_slot'));const im=document.createElement('img');im.className='thumb';im.src='../exports/thumbnails/'+id+'.png';b.append(im);const label=document.createElement('span');label.className='name';label.textContent=name;b.append(label);if(expanded&&!byName[id]?.furniture_definition_id){const t=document.createElement('span');t.className='future';t.textContent='备用';b.append(t)}if(id===selected){b.append(piece('item_selected','selection'));document.querySelector('#detailImage').src=im.src;document.querySelector('#detailName').textContent=name;document.querySelector('#detailText').textContent=description;}b.onclick=()=>select(id);container.append(b)}document.querySelector('#smallnote').style.display=expanded?'none':'block';document.querySelector('#explanation').textContent=expanded?'参考扩展目录 · 备用图不代表可摆放家具':'当前四种家具 · 点击卡片仅切换展示';document.querySelector('#catalogToggle').textContent=expanded?'查看当前真实目录':'查看参考扩展目录'}
document.querySelector('#catalogToggle').onclick=()=>{expanded=!expanded;selected=expanded?'potted_fern':'storage_chest';render()};
document.querySelectorAll('.action').forEach(b=>b.onclick=()=>{document.querySelector('.hint span').textContent='美术预览 · 操作由 Godot 接入';});
function resize(){const scale=Math.min(window.innerWidth/1600,(window.innerHeight-48)/1000);document.querySelector('#stage').style.transform='scale('+scale+')';Object.assign(document.querySelector('#viewport').style,{width:(1600*scale)+'px',height:(1000*scale)+'px'});}window.onresize=resize;resize();render();
</script></html>
